<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeowMunch — Smart Cat Feeder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
    }
  </style>
</head>
<body class="bg-[#FBF8F5] text-stone-700 min-h-screen p-4 sm:p-8 flex justify-center items-start">

  <main class="w-full max-w-md space-y-4">

    <!-- Header Section with MeowMunch Branding -->
    <header class="flex justify-between items-center bg-white/90 backdrop-blur-sm border border-stone-200/80 p-4 rounded-3xl shadow-sm">
      <div class="space-y-0.5">
        <h1 class="text-xl font-bold text-stone-800 tracking-tight">MeowMunch</h1>
        <p class="text-[11px] font-semibold text-stone-400">Smart Automatic Feeder</p>
      </div>

      <div class="flex items-center space-x-2 bg-emerald-50 border border-emerald-100 px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-bold text-emerald-700">Online</span>
      </div>
    </header>

    <!-- Quick Status Cards -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white border border-stone-200/70 p-4 rounded-3xl shadow-sm space-y-1">
        <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Last Meal Time</span>
        <p id="lastFedDisplay" class="text-sm font-bold text-stone-800">Never</p>
      </div>

      <div class="bg-white border border-stone-200/70 p-4 rounded-3xl shadow-sm space-y-1">
        <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Meals Today</span>
        <p id="feedCountDisplay" class="text-sm font-bold text-stone-800">0 bowls served</p>
      </div>
    </section>

    <!-- Instant Feed Action -->
    <section class="bg-[#FFF4EE] border border-[#FFE2D4] p-4.5 rounded-3xl shadow-sm flex items-center justify-between">
      <div class="space-y-0.5">
        <h2 class="text-xs font-bold text-[#D96B43]">Extra Snack</h2>
        <p class="text-[11px] text-stone-500 font-medium">Dispense one standard portion</p>
      </div>
      <button 
        id="manualFeedBtn"
        type="button"
        class="py-2.5 px-4 bg-[#E07A5F] hover:bg-[#D46B4E] active:scale-95 text-white font-bold text-xs rounded-2xl transition duration-150 shadow-sm cursor-pointer"
      >
        Feed Now
      </button>
    </section>

    <!-- Feeding Schedule (3 Slots) -->
    <section class="bg-white border border-stone-200/70 p-5 rounded-3xl shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-stone-400">Daily Meal Schedule</h2>
          <p class="text-xs font-bold text-stone-800 mt-0.5">3 Meal Slots Available</p>
        </div>
      </div>

      <form id="scheduleForm" class="space-y-3">
        
        <!-- Slot 1 -->
        <div class="p-3.5 bg-[#FAF7F2] border border-stone-200/60 rounded-2xl space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-stone-700">Breakfast Routine</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="slot1Active" checked class="sr-only peer" />
              <div class="w-9 h-5 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#81B29A]"></div>
            </label>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <input 
              type="time" 
              id="slot1Time" 
              value="07:30" 
              class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-3 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]"
            />
            <select id="slot1Portion" class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-2 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]">
              <option value="15g">15 grams</option>
              <option value="25g" selected>25 grams</option>
              <option value="35g">35 grams</option>
            </select>
          </div>
        </div>

        <!-- Slot 2 -->
        <div class="p-3.5 bg-[#FAF7F2] border border-stone-200/60 rounded-2xl space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-stone-700">Lunch Routine</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="slot2Active" checked class="sr-only peer" />
              <div class="w-9 h-5 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#81B29A]"></div>
            </label>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <input 
              type="time" 
              id="slot2Time" 
              value="12:30" 
              class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-3 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]"
            />
            <select id="slot2Portion" class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-2 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]">
              <option value="15g">15 grams</option>
              <option value="25g" selected>25 grams</option>
              <option value="35g">35 grams</option>
            </select>
          </div>
        </div>

        <!-- Slot 3 -->
        <div class="p-3.5 bg-[#FAF7F2] border border-stone-200/60 rounded-2xl space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-stone-700">Dinner Routine</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="slot3Active" checked class="sr-only peer" />
              <div class="w-9 h-5 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#81B29A]"></div>
            </label>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <input 
              type="time" 
              id="slot3Time" 
              value="18:30" 
              class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-3 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]"
            />
            <select id="slot3Portion" class="w-full bg-white border border-stone-200 text-stone-700 font-bold px-2 py-1.5 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-[#81B29A]">
              <option value="15g">15 grams</option>
              <option value="25g" selected>25 grams</option>
              <option value="35g">35 grams</option>
            </select>
          </div>
        </div>

        <button 
          type="submit"
          id="saveScheduleBtn"
          class="w-full py-3 bg-[#3D405B] hover:bg-[#32354B] active:scale-[0.99] text-white font-bold text-xs rounded-2xl transition duration-150 cursor-pointer shadow-sm mt-2"
        >
          Save Schedule Settings
        </button>
      </form>
    </section>

    <!-- Activity Log -->
    <section class="bg-white border border-stone-200/70 p-4 rounded-3xl shadow-sm space-y-2.5">
      <div class="flex justify-between items-center">
        <h3 class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Activity History</h3>
        <div class="flex items-center space-x-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span class="text-[10px] font-semibold text-stone-400">Firebase Cloud</span>
        </div>
      </div>
      <ul id="logList" class="space-y-1.5 text-xs text-stone-600"></ul>
    </section>

  </main>

  <script>
    // Firebase Web App Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDO9TUMbgYtyo4Np1qEqYOCygHbhfDjFzY",
      authDomain: "meowmunch-iot.firebaseapp.com",
      databaseURL: "https://meowmunch-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "meowmunch-iot",
      storageBucket: "meowmunch-iot.firebasestorage.app",
      messagingSenderId: "826040498565",
      appId: "1:826040498565:web:19d085d2cdd1ea89ebacec",
      measurementId: "G-FHZBN5WECP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // DOM Elements
    const manualBtn = document.getElementById('manualFeedBtn');
    const saveBtn = document.getElementById('saveScheduleBtn');
    const lastFedDisplay = document.getElementById('lastFedDisplay');
    const feedCountDisplay = document.getElementById('feedCountDisplay');
    const scheduleForm = document.getElementById('scheduleForm');
    const logList = document.getElementById('logList');

    function addLog(action, time) {
      const displayTime = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const li = document.createElement('li');
      li.className = 'p-2.5 bg-[#FAF7F2] rounded-xl flex justify-between items-center';
      li.innerHTML = `<span class="font-semibold text-stone-700">${action}</span><span class="text-[10px] text-stone-400 font-bold">${displayTime}</span>`;
      logList.prepend(li);
    }

    // 1. Listeners para sa Realtime Database Updates
    db.ref('/logs/last_fed').on('value', (snap) => {
      const val = snap.val();
      if (val) lastFedDisplay.textContent = val;
    });

    db.ref('/logs/today_count').on('value', (snap) => {
      const count = snap.val() || 0;
      feedCountDisplay.textContent = `${count} bowls served`;
    });

    db.ref('/schedules').on('value', (snap) => {
      const data = snap.val();
      if (data) {
        if (data.slot_1) {
          document.getElementById('slot1Time').value = data.slot_1.time || "07:30";
          document.getElementById('slot1Portion').value = data.slot_1.portion || "25g";
          document.getElementById('slot1Active').checked = data.slot_1.enabled ?? true;
        }
        if (data.slot_2) {
          document.getElementById('slot2Time').value = data.slot_2.time || "12:30";
          document.getElementById('slot2Portion').value = data.slot_2.portion || "25g";
          document.getElementById('slot2Active').checked = data.slot_2.enabled ?? true;
        }
        if (data.slot_3) {
          document.getElementById('slot3Time').value = data.slot_3.time || "18:30";
          document.getElementById('slot3Portion').value = data.slot_3.portion || "25g";
          document.getElementById('slot3Active').checked = data.slot_3.enabled ?? true;
        }
      }
    });

    // 2. Button Triggers & Form Submissions
    manualBtn.addEventListener('click', () => {
      manualBtn.disabled = true;
      manualBtn.textContent = 'Sending to Feeder...';

      db.ref('/feeder_config').update({ manual_trigger: true }).then(() => {
        addLog('Manual snack requested');
        setTimeout(() => {
          manualBtn.disabled = false;
          manualBtn.textContent = 'Feed Now';
        }, 1500);
      });
    });

    scheduleForm.addEventListener('submit', (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const payload = {
        slot_1: {
          time: document.getElementById('slot1Time').value,
          portion: document.getElementById('slot1Portion').value,
          enabled: document.getElementById('slot1Active').checked
        },
        slot_2: {
          time: document.getElementById('slot2Time').value,
          portion: document.getElementById('slot2Portion').value,
          enabled: document.getElementById('slot2Active').checked
        },
        slot_3: {
          time: document.getElementById('slot3Time').value,
          portion: document.getElementById('slot3Portion').value,
          enabled: document.getElementById('slot3Active').checked
        }
      };

      db.ref('/schedules').set(payload).then(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Schedule Settings';
        addLog('Schedules synced to cloud');
        alert('Meal schedules successfully updated!');
      });
    });
  </script>
</body>
</html>
